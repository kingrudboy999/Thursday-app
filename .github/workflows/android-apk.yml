name: Build Slim Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android project with ABI splits & R8 slimming
        run: npx expo prebuild --platform android --clean

      - name: Assemble Release APKs
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Slim arm64-v8a & armeabi-v7a APKs
        uses: actions/upload-artifact@v4
        with:
          name: thursday-android-slim-apks
          path: mobile/android/app/build/outputs/apk/release/*.apk
