name: Build Slim Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # NOTE: android-actions/setup-android@v3 is deliberately NOT used.
      # The ubuntu-latest image ships cmdline-tools 16.0, which that action
      # cannot parse ("Wrong version in preinstalled sdkmanager"). It then
      # pipes /dev/null at the licence prompts, sdkmanager exits 1, and the
      # whole job dies before a single line of our code runs. The runner
      # already has a usable SDK, so we just point at it and install the one
      # platform Expo SDK 52 needs.
      # `yes | sdkmanager` leaves `yes` killed by SIGPIPE when sdkmanager
      # exits; with `set -o pipefail` that 141 becomes the step's exit code and
      # fails the build even though the install worked. So: no pipefail here,
      # and the licence loop is silenced rather than chained.
      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "using $SDKMANAGER"
          ( yes || true ) | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --version

      - name: Install Android platform
        run: |
          set -eu
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          ( yes || true ) | "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            > /tmp/sdk-install.log 2>&1 || true
          echo "--- last lines of the sdkmanager log ---"
          tail -6 /tmp/sdk-install.log
          # verify rather than trust the exit code, which is unreliable above
          for pkg in "platforms/android-35" "build-tools/35.0.0"; do
            if [ ! -d "$ANDROID_HOME/$pkg" ]; then
              echo "::error::missing $pkg after sdkmanager run"
              exit 1
            fi
            echo "ok: $ANDROID_HOME/$pkg"
          done
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install mobile dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck the app
        run: npx tsc --noEmit

      - name: Prebuild Android project with ABI splits & R8 slimming
        run: npx expo prebuild --platform android --clean

      - name: Assemble Release APKs
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Slim arm64-v8a & armeabi-v7a APKs
        uses: actions/upload-artifact@v4
        with:
          name: thursday-android-slim-apks
          path: mobile/android/app/build/outputs/apk/release/*.apk
