arly mornings.",followers:5310,following:620,location:"Bend, OR",website:"jonahwalks.com",joined:"Joined June 2020",cover:ee.mountains},{id:"priya",name:"Priya Raman",handle:"priyaclay",avatar:kl(5253959),bio:"Ceramics teacher. Small batches, slow mornings, quiet shelves.",followers:8920,following:274,verified:!0,location:"Berkeley, CA",website:"priyaraman.clay",joined:"Joined February 2018",cover:ee.ceramicMolds},{id:"theo",name:"Theo Martins",handle:"theomakes",avatar:kl(21550592),bio:"Photographer of ordinary light. Currently making a zine about corner shops.",followers:22100,following:390,verified:!0,location:"Lisbon, PT",website:"theomartins.photo",joined:"Joined September 2017",cover:ee.coffee},{id:"lena",name:"Lena Fischer",handle:"lenafischer",avatar:kl(36665716),bio:"Illustrator & occasional florist. Studio dog co-worker.",followers:6700,following:502,location:"Portland, OR",website:"lena.works",joined:"Joined April 2022",cover:ee.pampas},{id:"sam",name:"Sam Okafor",handle:"samokafor",avatar:kl(8499278),bio:"Records, small radios, and the perfect flat white.",followers:4100,following:355,location:"Brooklyn, NY",website:"samokafor.fm",joined:"Joined January 2019",cover:ee.vinyl},{id:"amara",name:"Amara Diallo",handle:"amaradiallo",avatar:kl(6012304),bio:"Textile artist and colour obsessive. Making cloth slowly in Lagos and London.",followers:15800,following:412,verified:!0,location:"Lagos, NG",website:"amaradiallo.textile",joined:"Joined November 2020",cover:ee.potteryWindow},{id:"ravi",name:"Ravi Kapoor",handle:"ravikapoor",avatar:kl(40765738),bio:"Documentary photographer. Chasing ordinary light in crowded places.",followers:9400,following:288,location:"Bengaluru, IN",website:"ravi.photo",joined:"Joined May 2019",cover:ee.bookshop}],a7=[{id:"post_me_1",authorId:"me",time:"18m",pinned:!0,circleId:"circle_making",text:"Five weeks at the wheel and I've finally made something that can hold coffee without an apology. It's slightly uneven. That is the point. The studio light was very kind this morning.",images:[ee.potteryTools],imageAlt:"A hand-built ceramic cup in a bright pottery studio",likes:96,reposts:4,liked:!1,saved:!1,topic:"Made by hand",place:"San Francisco, CA",comments:[{id:"cm1",authorId:"priya",text:"The rim on that one is lovely. Bring it Saturday and we'll glaze it together.",time:"12m",likes:7},{id:"cm2",authorId:"me",text:"Deal. I'll bring the good coffee this time.",time:"8m",likes:2}]},{id:"post_1",authorId:"maya",time:"32m",text:"A weekend that did the exact thing weekends are supposed to do: nothing on a schedule, lunch that lasted three hours, and a walk home through the long grass. Still thinking about it.",images:[ee.friendsMeadow],imageAlt:"Three friends laughing together in a meadow at golden hour",likes:284,reposts:12,liked:!1,saved:!1,topic:"Slow living",place:"Point Reyes, CA",comments:[{id:"c1",authorId:"lena",text:"That light! This is the whole mood of summer.",time:"18m",likes:6},{id:"c2",authorId:"sam",text:"Next weekend we try the bakery on the way? I have notes.",time:"9m",likes:2}]},{id:"post_2",authorId:"priya",time:"1h",text:"Finished a small run of these cup-and-saucer pairs this morning before the light got too generous. The glaze is a little warmer than I planned. I think I like it better that way.",images:[ee.ceramicMolds],imageAlt:"Handmade ceramic pieces on a studio shelf in natural light",likes:419,reposts:28,liked:!0,saved:!0,topic:"Making things",place:"Berkeley, CA",comments:[{id:"c3",authorId:"theo",text:"The surface on the second one is unreal. Can I photograph the set?",time:"42m",likes:11},{id:"c4",authorId:"me",text:"Please save one pair for me. I'll pick it up Saturday.",time:"35m",likes:3}]},{id:"post_3",authorId:"jonah",time:"3h",text:"Left the trailhead at 5:40 to catch the quiet before the heat. Seven miles in, the clouds finally opened up over the ridge. Worth every step of the very early alarm.",images:[ee.mountains],imageAlt:"Dramatic mountain ridge with low clouds and green slopes",likes:1020,reposts:44,liked:!1,saved:!1,topic:"Outside",place:"Broken Top, OR",comments:[{id:"c5",authorId:"maya",text:"You keep saying 'worth the alarm' and I keep looking at my bed.",time:"2h",likes:24}]},{id:"post_4",authorId:"theo",time:"5h",text:"Everything I learned in my twenties, I relearned at a café counter over a very good coffee. Notes on the zine are officially closed. It is going to the printer on Friday.",images:[ee.coffee],imageAlt:"A glass of latte with heart latte art on a wooden café table",likes:673,reposts:31,liked:!1,saved:!0,topic:"Photography",place:"Lisbon, PT",comments:[{id:"c6",authorId:"sam",text:"Ordering two. One for the shelf, one for reading.",time:"3h",likes:8},{id:"c7",authorId:"priya",text:"That table has been in so many of your frames. I feel like I know it.",time:"1h",likes:4}]},{id:"post_5",authorId:"sam",time:"Yesterday",text:"A brief and strongly held opinion: the best way to spend a Saturday is flipping through crates with no list and one hour that quietly becomes four. Found a 1968 pressing for less than lunch.",images:[ee.vinyl],imageAlt:"A person browsing vinyl records in a warm, packed record shop",likes:388,reposts:14,liked:!0,saved:!1,topic:"Music",place:"Brooklyn, NY",comments:[{id:"c8",authorId:"theo",text:"The one hour becoming four is the whole thing. Every time.",time:"Yesterday",likes:5}]},{id:"post_6",authorId:"lena",time:"Yesterday",text:"Office hours with the dog, the flowers, and absolutely no emails. The commissions can wait until Monday.",images:[ee.pampas],imageAlt:"Friends together among tall pampas grass in warm evening light",likes:546,reposts:9,liked:!1,saved:!1,topic:"Studio",place:"Portland, OR",comments:[{id:"c9",authorId:"maya",text:"This is a public service announcement for resting.",time:"22h",likes:15}]}],l7=[{id:"story_me",authorId:"me",image:ee.potteryTools,caption:"Week five: the wheel and I are no longer enemies."},{id:"story_1",authorId:"priya",image:ee.potteryWindow,caption:"A quiet afternoon in the studio."},{id:"story_2",authorId:"jonah",image:ee.trail,caption:"Before the clouds arrived."},{id:"story_3",authorId:"maya",image:ee.latte,caption:"Found it. The best flat white in the East Bay."},{id:"story_4",authorId:"theo",image:ee.vinylClose,caption:"Zine week. Counting down."},{id:"story_5",authorId:"lena",image:ee.paintBrushes,caption:"New inks, new season."},{id:"story_6",authorId:"sam",image:ee.greenCup,caption:"Saturday, sorted."}],n7=[{id:"conv_maya",personId:"maya",unread:2,online:!0,pinned:!0,lastActive:"Active now",messages:[{id:"m1",from:"them",text:"Your ceramics from last week are still living rent free in my head.",time:"9:12 AM"},{id:"m2",from:"me",text:"They are extremely lopsided in person. That is their charm.",time:"9:18 AM"},{id:"m3",from:"them",text:"Charm is the right word. Are you going to sell a few?",time:"9:19 AM"},{id:"m4",from:"me",text:"Priya is teaching a small market in July. Here's the flyer.",time:"9:24 AM",attachment:{type:"image",url:ee.potteryHands,caption:"July Makers Market"},reactions:["❤️"]},{id:"m5",from:"them",text:"Perfect. Also — dinner on Thursday? I have a new recipe that needs a test audience.",time:"9:31 AM"},{id:"m6",from:"them",text:"Bring the lopsided cup. It's the guest of honour.",time:"9:31 AM"}]},{id:"conv_priya",personId:"priya",unread:0,online:!0,lastActive:"Active now",messages:[{id:"p1",from:"me",text:"The glaze came out exactly the way you described. I'm not sure I have ever been this pleased with a cup.",time:"Yesterday"},{id:"p2",from:"them",text:"Isn't it the best feeling? I've been chasing that exact warmth for years.",time:"Yesterday"},{id:"p2b",from:"me",text:"Quick note for Saturday, in case I forget it out loud.",time:"Yesterday",attachment:{type:"voice",duration:"0:24"},reactions:["🫶"]},{id:"p3",from:"them",text:"Saturday morning works for collection. Come by after ten and we'll have coffee.",time:"Yesterday"}]},{id:"conv_joint",personId:"jonah",unread:0,online:!1,messages:[{id:"j1",from:"them",text:"Are you joining the Pt. Reyes hike at the end of the month?",time:"Mon"},{id:"j2",from:"me",text:"If it stays under eight miles, absolutely. I'm a slow but enthusiastic participant.",time:"Mon"},{id:"j3",from:"them",text:"Deal. I'll make the short version official.",time:"Mon"}]},{id:"conv_theo",personId:"theo",unread:1,online:!1,muted:!0,messages:[{id:"t1",from:"them",text:"Print run is confirmed for Friday. I have two sides for you.",time:"Sun"},{id:"t2",from:"me",text:"I can't believe it's actually happening. Proud of you.",time:"Sun"},{id:"t3",from:"them",text:"Front and back, together. We have arrived.",time:"Sun"}]},{id:"conv_sam",personId:"sam",unread:0,online:!1,messages:[{id:"s1",from:"them",text:"Did you see the record fair poster? October 12.",time:"Fri"},{id:"s2",from:"me",text:"Clearing the calendar and finding my tote bag as we speak.",time:"Fri"}]},{id:"conv_amara",personId:"amara",unread:1,online:!1,request:!0,lastActive:"Active 2h ago",messages:[{id:"a1",from:"them",text:"Hi Nora — Priya shared your studio post with our Circle. I'm building a small show about everyday objects in Lagos and would love to include one of your cups.",time:"11:04 AM"},{id:"a2",from:"them",text:"No rush at all. Happy to send the details first.",time:"11:05 AM"}]},{id:"conv_ravi",personId:"ravi",unread:1,online:!1,request:!0,lastActive:"Active yesterday",messages:[{id:"r1",from:"them",text:"Your photo walk idea came up in Soft Launch. I'm in Bengaluru, but I'd love to swap notes on a quiet version of it for your neighbourhood.",time:"Yesterday"}]}],s7=[{id:"reel_1",authorId:"theo",video:"https://videos.pexels.com/video-files/7658231/7658231-hd_1080_1920_25fps.mp4",poster:ee.coffee,caption:"The whole café went quiet for this pour. Ten seconds of proof that small things still matter.",audio:"Neighbourhood — Kite Season",location:"Lisbon, PT",likes:12800,shares:412,views:184e3,liked:!1,saved:!1,comments:[{id:"r1c1",authorId:"maya",text:"T
